syntax = "proto3";

import "google/protobuf/timestamp.proto";

import "influx/lab_measurement_created_event.proto";

import "influx/medical_case_created_event.proto";
import "influx/medical_case_deleted_event.proto";
import "influx/medical_case_updated_event.proto";

import "influx/patient_created_event.proto";
import "influx/patient_deleted_event.proto";
import "influx/patient_died_event.proto";
import "influx/patient_updated_event.proto";

import "influx/procedure_created_event.proto";
import "influx/procedure_deleted_event.proto";
import "influx/procedure_updated_event.proto";

option java_multiple_files = true;
option java_package = "eu.ampel_platform.messaging.events";

package ampel;

message AmpelEvent {
  string event_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  string event_type = 3;

  // Primary ID of the entity that is described by the payload.
  // This gets duplicated here for routing purposes etc. but is still kept in the payload itself as well for
  // completeness of the model.
  string tracking_id = 4;

  oneof payload {
    // starting here at 20 in order to leave room for additional metadata fields
    // that may get added in the future.
    ProcedureCreatedEvent procedure_created_event = 20;
    ProcedureDeletedEvent procedure_deleted_event = 21;
    ProcedureUpdatedEvent procedure_updated_event = 22;

    PatientCreatedEvent patient_created_event = 30;
    PatientDeletedEvent patient_deleted_event = 31;
    PatientDiedEvent patient_died_event = 32;
    PatientUpdatedEvent patient_updated_event = 33;

    MedicalCaseCreatedEvent medical_case_created_event = 40;
    MedicalCaseDeletedEvent medical_case_deleted_event = 41;
    MedicalCaseUpdatedEvent medical_case_updated_event = 42;

    LabMeasurementCreatedEvent lab_measurement_created_event = 50;
  }
}
