syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "common/event_name_option.proto";

option java_multiple_files = true;
option java_package = "eu.ampel_platform.messaging.events.influx";

package ampel;

message LabMeasurementCreatedEvent {
  option (ampel.event_name) = "lab-measurement.created";

  string lab_measurement_id = 1;
  string medical_case_id = 2;
  string lab_measurement_order_id = 3;
  string lab_measuring_code = 4;
  float lab_measuring_value = 5;
  string lab_measuring_unit = 6;
  google.protobuf.Timestamp measured_at = 7;
}
