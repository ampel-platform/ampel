syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "common/event_name_option.proto";

option java_multiple_files = true;
option java_package = "eu.ampel_platform.messaging.events.influx";

package ampel;

message ProcedureCreatedEvent {
  option (ampel.event_name) = "procedure.created";

  string medical_case_id = 1;
  string procedure_id = 2;
  string procedure_code = 3;
  google.protobuf.Timestamp conducted_at = 4;
}
