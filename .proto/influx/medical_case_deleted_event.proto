syntax = "proto3";

import "common/event_name_option.proto";

option java_multiple_files = true;
option java_package = "eu.ampel_platform.messaging.events.influx";

package ampel;

message MedicalCaseDeletedEvent {
  option (ampel.event_name) = "medical-case.deleted";

  string medical_case_id = 1;
}
