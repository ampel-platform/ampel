syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "common/event_name_option.proto";

option java_multiple_files = true;
option java_package = "eu.ampel_platform.messaging.events.influx";

package ampel;

message ProcedureUpdatedEvent {
  option (ampel.event_name) = "procedure.updated";

  string procedure_id = 1;
  string procedure_code = 2;
  google.protobuf.Timestamp conducted_at = 3;
}
