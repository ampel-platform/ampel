services:
  ampel-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ampel-ui:local
    ports:
      - '3003:3003'
    environment:
      BASE_API_URL: 'http://backend:8080'
      HEADER_PRODUCT_LOGO_URL: 'assets/brand-default-logo.svg'
      HEADER_CLINIC_LOGO_URL: 'assets/clinical-default-logo.svg'
      HEADER_TICKET_LINK: '1'
      HEADER_CONTACT_PHONE: '1'
      HEADER_MT_NUMBER: '1'
      HEADER_INSTRUCTIONS_LINK: '1'
      TZ: 'Europe/Berlin'

  ampel-ui-dev:
    profiles:
      - dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development-dependencies-env
    image: ampel-ui:dev
    working_dir: /ui/app
    ports:
      - '5173:5173'
    environment:
      BASE_API_URL: 'http://backend:8080'
      TZ: 'Europe/Berlin'
    volumes:
      - .:/app
      - ampel_ui_dev_node_modules:/app/node_modules
    command: >
      sh -c "npm ci &&
      npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  ampel_ui_dev_node_modules:
