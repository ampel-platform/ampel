edition = "2024";

import "google/protobuf/timestamp.proto";
import "common/sex.proto";

option java_package = "eu.ampel_platform.messaging_sdk.generated.events.influx";

package ampel.influx.v1;

message AmpelPatientCreatedEvent {
  string patient_id = 1;
  string firstname = 2;
  string lastname = 3;
  ampel.v1.AmpelSex sex = 4;
  google.protobuf.Timestamp date_of_birth = 5;
}
