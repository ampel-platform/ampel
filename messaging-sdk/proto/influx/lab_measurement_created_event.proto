edition = "2024";

import "google/protobuf/timestamp.proto";

option java_package = "eu.ampel_platform.messaging_sdk.generated.events.influx";

package ampel.influx.v1;

message AmpelLabMeasurementCreatedEvent {
  string lab_measurement_id = 1;
  string medical_case_id = 2;
  string lab_measurement_order_id = 3;
  string lab_measuring_code = 4;
  float lab_measuring_value = 5;
  string lab_measuring_unit = 6;
  google.protobuf.Timestamp measured_at = 7;
  string lab_measuring_system = 8;
}
