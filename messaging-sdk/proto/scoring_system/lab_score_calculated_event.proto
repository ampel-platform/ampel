edition = "2024";

import "google/protobuf/timestamp.proto";
import "scoring_system/score.proto";

option java_package = "eu.ampel_platform.messaging_sdk.generated";

package ampel.scoring_system.v1;

message  AmpelLaboratoryScoreCalculatedEvent {
  string score_id = 1;
  string scoring_system_name = 2;
  string scoring_system_version = 3;
  string medical_case_id = 4;
  AmpelScore score = 5;
  string scoring_system_severity_code = 6;
  string analyte_name = 7;
  double analyte_value = 8;
  string analyte_unit = 9;
  google.protobuf.Timestamp analyte_measured_at = 10;
  google.protobuf.Timestamp calculated_at = 11;
}
