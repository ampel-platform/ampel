edition = "2024";

import "google/protobuf/timestamp.proto";
import "scoring_system/score.proto";

option java_package = "eu.ampel_platform.messaging_sdk.generated";

package ampel.scoring_system.v1;

message  AmpelLaboratoryScoreCalculatedEvent {
  string score_id = 1;
  string scoring_system_name = 2;
  string scoring_system_version = 3;
  string medical_case_id = 4;
  string laboratory_order_id = 5;
  AmpelScore score = 6;
  string scoring_system_severity_code = 7;
  string scoring_system_comment = 8;
  string analyte_name = 9;
  double analyte_value = 10;
  string analyte_unit = 11;
  string measuring_system = 12;
  google.protobuf.Timestamp analyte_measured_at = 13;
  google.protobuf.Timestamp calculated_at = 14;
}
