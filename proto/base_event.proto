edition = "2024";

import "uuid4.proto";
import "google/protobuf/timestamp.proto";

// This is the base event of the platform. All messages are supposed to make use of this.
message BaseEvent {
  // This is an arbitrary string specific to each event.
  string type = 1;

  // A unique and traceable identifier for an event.
  UUID4 event_id = 2;

  // Defines when the event has been created.
  google.protobuf.Timestamp timestamp = 3;
}