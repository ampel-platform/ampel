edition = "2024";

import "base_event.proto";
import "google/protobuf/timestamp.proto";

package influx;

// Indicates that a procedure has been updated.
// The event covers the whole procedure so that no caching of a procedure is necessary at a consumer.
message ProcedureUpdatedEvent {
  BaseEvent event = 1;

  // Unique identifier of the procedure. This must not be confused with the procedure code as the latter describes the
  // procedure using a standard and this ID simply identifies the very procedure.
  //
  // NOTE:
  // This is kept as a string because some upstream systems may not use UUIDs.
  // In order to stay compatible with them, a generic string field is being used.
  string procedure_id = 2; // required

  // Denotes when the procedure has been updated in the source system.
  //
  // NOTE:
  // This is different from the event timestamp as the event time does not necessarily coincide with the update of a
  // procedure. E.g. this can happen during an initial bulk load of existing data that is being fed into the platform.
  google.protobuf.Timestamp updated_at = 3; // required

  // Code representation of the procedure.
  // This is supposed to be a standard code used in the medical domain, e.g. OPS code etc.
  string procedure_code = 4; // required

  // Denotes when the procedure has been conducted.
  //
  // NOTE:
  // This is different from the event timestamp as the event time does not necessarily coincide with the time a
  // procedure has been conducted within the source system. E.g. this can happen during an initial bulk load of existing
  // data that is fed into the platform.
  google.protobuf.Timestamp conducted_at = 5; // required
}