edition = "2024";

import "base_event.proto";
import "google/protobuf/timestamp.proto";

package influx;

// Indicates that a laboratory value has been updated.
// The event covers the whole laboratory value record so that no caching of it is necessary at any consumer.
message LaboratoryValueUpdatedEvent {
  BaseEvent event = 1;

  // Unique identifier of the laboratory value.
  //
  // NOTE:
  // This is kept as a string because some upstream systems may not use UUIDs.
  // In order to stay compatible with them, a generic string field is being used.
  string laboratory_value_id = 2; // required

  // Denotes when the laboratory value has been updated in the source system.
  //
  // NOTE:
  // This is different from the event timestamp as the event time does not necessarily coincide with the update of a
  // laboratory value. E.g. this can happen during an initial bulk load of existing data that is being fed into the
  // platform.
  google.protobuf.Timestamp updated_at = 3; // required

  // The source system the laboratory value stems from.
  // Think of it as a certain medical device that a patient is hooked up to for example.
  string source = 4; // required

  // Standard code representation of the laboratory value that has been measured.
  string code = 5; // required

  // Actual numerical value of the laboratory value that has been measured.
  double value = 6; // required

  // Unit of the laboratory value that has been measured.
  string unit = 7; // required

  // Denotes when the laboratory value was actually measured.
  //
  // NOTE:
  // This is different from the event timestamp as the event time does not necessarily coincide with the time something
  // has been measured within the source system. E.g. this can happen during an initial bulk load of existing data that
  // is being fed into the platform.
  google.protobuf.Timestamp measured_at = 8; // required
}
