edition = "2024";

import "base_event.proto";
import "google/protobuf/timestamp.proto";

package influx;

// Indicates that a patient has been cancelled. Cancellation must not be confused with a patient that has died. The
// latter one is seen as a possible event whereas a cancellation is seen as a forced action.
message PatientCancelledEvent {
  BaseEvent event = 1;

  // Unique identifier of the patient.
  //
  // NOTE:
  // This is kept as a string because some upstream systems may not use UUIDs.
  // In order to stay compatible with them, a generic string field is being used.
  string patient_id = 2; // required

  // Denotes when the patient has been cancelled in the source system.
  //
  // NOTE:
  // This is different from the event timestamp as the event time does not necessarily coincide with the cancellation of
  // a patient. E.g. this can happen during an initial bulk load of existing data that is being fed into the platform.
  google.protobuf.Timestamp cancelled_at = 3;

  // Optional field for tracking why the patient has been cancelled.
  //
  // NOTE:
  // This is kept as a string and not made an enum in order to be as flexible as possible when it comes to different
  // upstream systems that may use completely different information models. Mapping them would otherwise be hard or even
  // impossible.
  string reason = 4;
}