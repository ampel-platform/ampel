edition = "2024";

import "base_event.proto";
import "google/protobuf/timestamp.proto";

package influx;

// Indicates that a diagnosis has been cancelled.
// This can happen if a patient has been misdiagnosed in the source system and this diagnosis has to be removed from the
// patient's medical case record.
message DiagnosisCancelledEvent {
  BaseEvent event = 1;

  // Unique identifier of the diagnosis.
  //
  // NOTE:
  // This is kept as a string because some upstream systems may not use UUIDs.
  // In order to stay compatible with them, a generic string field is being used.
  string diagnosis_id = 2; // required

  // Denotes when the diagnosis has been cancelled in the source system.
  //
  // NOTE:
  // This is different from the event timestamp as the event time does not necessarily coincide with the cancellation of
  // a diagnosis. E.g. this can happen during an initial bulk load of existing data that is being fed into the platform.
  google.protobuf.Timestamp cancelled_at = 3; // required

  // Optional field for tracking why the diagnosis has been cancelled.
  //
  // NOTE:
  // This is kept as a string and not made an enum in order to be as flexible as possible when it comes to different
  // upstream systems that may use completely different information models. Mapping them would otherwise be hard or even
  // impossible.
  string reason = 4;
}