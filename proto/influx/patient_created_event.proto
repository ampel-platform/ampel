edition = "2024";

import "base_event.proto";
import "date.proto";
import "sex.proto";
import "google/protobuf/timestamp.proto";

package influx;

// Indicates that a patient has been created.
message PatientCreatedEvent {
  BaseEvent event = 1;

  // Unique identifier of the patient.
  //
  // NOTE:
  // This is kept as a string because some upstream systems may not use UUIDs.
  // In order to stay compatible with them, a generic string field is being used.
  string patient_id = 2; // required

  // Denotes when the patient record has been created in the source system.
  //
  // NOTE:
  // This is different from the event timestamp as the event time does not necessarily coincide with the creation
  // timestamp of the patient. E.g. this can happen during an initial bulk load of existing data that is being fed
  // into the platform.
  google.protobuf.Timestamp created_at = 3; // required

  // Patient's firstname.
  string firstname = 4;

  // Patient's lastname.
  string lastname = 5;

  // Patient's date of birth.
  //
  // NOTE:
  // This date does not have any time zone attached to it. A birth date would only make sense with a time zone if the
  // place of birth is also known. For ease of use it is assumed that the patient was born in the same place as the
  // software is operating in. Applications in need of this information can simply use their local time zone.
  Date birth_date = 6;

  // Patient's sex.
  Sex sex = 7; // required (default: unknown)
}
