edition = "2024";

import "base_event.proto";
import "google/protobuf/timestamp.proto";

package influx;

// Indicates that a diagnosis has been created (aka a patient has been diagnosed).
message DiagnosisCreatedEvent {
  BaseEvent event = 1;

  // Unique identifier of the medical that this diagnosis is associated with.
  //
  // NOTE:
  // This is kept as a string because some upstream systems may not use UUIDs.
  // In order to stay compatible with them, a generic string field is being used.
  string medical_case_id = 2; // required

  // Unique identifier of the diagnosis.
  //
  // NOTE:
  // This is kept as a string because some upstream systems may not use UUIDs.
  // In order to stay compatible with them, a generic string field is being used.
  string diagnosis_id = 3; // required

  // Unique code representation of the diagnosis.
  // This is supposed to be a standard code used in the medical domain, e.g. LOINC, ICD-10 etc.
  string diagnosis_code = 4; // required

  // Denotes when something was diagnosed.
  //
  // NOTE:
  // This is different from the event timestamp as the event time does not necessarily coincide with the time something
  // has been diagnosed within the source system. E.g. this can happen during an initial bulk load of existing data that
  // is being fed into the platform.
  google.protobuf.Timestamp diagnosed_at = 5; // required
}